<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ID__ simulator</title>
<style>
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #EEF2F5; color: #0B0B0B; }
  main { display: flex; gap: 28px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  .machine { width: 405px; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 10px #1a1a1a, 0 20px 50px rgba(0,0,0,.3); background: #000; }
  .machine iframe { width: 100%; height: 100%; border: 0; display: block; }
  .panel { flex: 1; min-width: 300px; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  .group { background: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .group h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #5B6670; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 0; border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 700; background: #F1F4F7; cursor: pointer; }
  button.main { background: #000; color: #fff; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .out { font-size: 13px; color: #5B6670; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <div class="machine"><iframe src="/" title="__ID__ screen"></iframe></div>
  <div class="panel">
    <h1>__ID__ · simulated Model 6</h1>
    <div class="group"><h2>People</h2><div class="row"><button class="main" data-a="phone">Someone orders from the app</button></div><div class="out" id="out"></div></div>
    <div class="group"><h2>Faults</h2><div class="row"><button data-a="jam">Jam the next print</button><button data-a="stuck">Stick the next bottle</button><button data-a="fix">Fix everything</button></div></div>
    <div class="group"><h2>Stock and cabinet</h2><div class="row"><button data-a="soldout">Run out of bottles</button><button data-a="restock">Restock bottles</button><button data-a="labels">Refill labels and ink</button><button data-a="door">Open / close the door</button><button data-a="hot">Too warm / cool</button></div></div>
    <div class="group"><h2>Internet</h2><div class="row"><button data-a="net">Cut / restore the internet</button></div></div>
    <div class="group"><h2>What the machine knows</h2><pre id="state"></pre></div>
  </div>
</main>
<script>
  const out = document.getElementById('out');
  document.querySelectorAll('button[data-a]').forEach((b) => b.addEventListener('click', async () => {
    const r = await fetch('/sim/' + b.dataset.a, { method: 'POST' }).then((x) => x.json());
    if (b.dataset.a === 'phone') out.textContent = r.status < 300 ? 'Ordered. Watch the screen.' : (r.body.error && r.body.error.message) || 'Refused';
  }));
  setInterval(async () => { try { const s = await fetch('/sim/state').then((r) => r.json()); document.getElementById('state').textContent = JSON.stringify(s, null, 2); } catch {} }, 1000);
</script>
</body>
</html>
