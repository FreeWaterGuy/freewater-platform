<meta charset="utf-8">
<title>FreeWater App</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/*APP_CSS*/
.preview-note { max-width: 520px; margin: 0 auto; padding: 10px 18px 0; font-size: 13px; color: #5C3F00; }
.preview-note span { display: block; background: #FFF4D6; border-radius: 12px; padding: 8px 12px; }
</style>
<div class="preview-note"><span><b>Preview.</b> This is the real app with saved answers from the server. Sign in with any email and any 6 digits. Nothing prints and no money moves.</span></div>
<div id="root"><div class="boot"><div class="logo big"><span>free</span><span>water</span></div></div></div>
<script>/*LOCAL*/</script>
<script>
(() => {
  const D = /*DATA*/;
  const L = FWLocal.makeLocal();
  const SCAN_CSS = /*SCAN_CSS*/, SCAN_JS = /*SCAN_JS*/;
  const DS = { designs: new Map(), files: new Map(), n: 0 };
  const W = Math.round((L.product.label.widthIn - L.product.label.seamIn - L.product.label.panelWidthIn) * 100), H = Math.round(L.product.label.heightIn * 100);
  const designView = (r) => {
    const left = L.designMissing(r.design);
    const { label, ...rest } = r.design;
    return { id: r.id, status: r.status, assistant: 'built-in helper', design: { ...rest, label: label ? { ...label, photo: label.photo ? true : undefined } : undefined, quantity: r.design.quantity ?? 1 },
      designSvg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${L.renderKeepsake(L.labelSpec(r.design), W, H, (r.design.names || [])[0])}</svg>`,
      messages: [...r.messages], missing: left.map((m) => ({ id: m, label: L.designMissingLabels[m] })), ready: left.length === 0 && !!r.design.label?.headline, priceCents: 300, totalCents: 300 * (r.design.quantity ?? 1) };
  };
  // Files in the preview stay in the page; the scan page is shown them through their stand-in addresses.
  const swapFiles = (o) => JSON.parse(JSON.stringify(o).replace(/\/assets\/pv-[a-z0-9]+\.(jpg|mp4)/g, (u) => DS.files.get(u) || u));
  const S = { me: null, bottles: [], saved: [], cards: [], vendIndex: 0, labels: {}, proofDesign: null, customCount: 0 };
  const err = (status, code, message) => { const e = new Error(message); e.status = status; e.code = code; throw e; };
  const statsOf = () => ({ bottles: S.bottles.length, donatedCents: S.bottles.reduce((s, b) => s + b.donatedCents, 0), savedCents: S.bottles.filter((b) => b.kind !== 'custom').length * 100 });
  const inner = (svg) => svg.slice(svg.indexOf('>', svg.indexOf('<svg')) + 1, svg.lastIndexOf('</svg>'));
  window.__FW_APP_FIXTURE__ = {
    start: '/app/m/ATX-014?c=preview',
    upload(file) { const url = `/assets/pv-${(++DS.n).toString(36)}.mp4`; DS.files.set(url, URL.createObjectURL(file)); return { id: url, url }; },
    scanFrame() {
      const f = document.createElement('iframe');
      f.title = 'What scanning it opens';
      f.style.cssText = 'width:100%;height:520px;border:0;border-radius:22px;box-shadow:0 0 0 8px #000;background:#fff';
      f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${SCAN_CSS}</style></head><body><main id="app"></main><script>window.__FW_FIXTURE__={path:'/preview/scan',api:async()=>({})};<\/script><script>${SCAN_JS.replace(/<\/script/g, '<\\/script')}<\/script></body></html>`;
      return f;
    },
    async api(method, url, body, state) {
      await new Promise((r) => setTimeout(r, 120));
      const path = url.split('?')[0];
      const key = `${method} ${path}`;
      if (D.rec[key]) return D.rec[key];
      if (key === 'POST /v1/auth/start') return { sent: true, expiresInMinutes: 10 };
      if (key === 'POST /v1/auth/verify') {
        if (!/^\d{6}$/.test(String(body.code).trim())) err(400, 'bad_code', 'That code isn’t right. Check it and try again.');
        S.me = { ...D.me, email: body.channel === 'email' ? body.to : null, phone: body.channel === 'sms' ? body.to : null, displayName: null };
        return { token: 'fws_preview', isNew: true, user: S.me };
      }
      if (!S.me) err(401, 'signed_out', 'Sign in again.');
      if (key === 'GET /v1/me') return S.me;
      if (key === 'PATCH /v1/me') { S.me = { ...S.me, ...('displayName' in body ? { displayName: body.displayName } : {}), ...(body.interests ? { interests: body.interests } : {}), consents: { ...S.me.consents, ...(body.consents || {}) } }; return S.me; }
      if (key === 'GET /v1/me/export') return { account: S.me, bottles: S.bottles, saved: S.saved };
      if (key === 'POST /v1/auth/sign-out' || key === 'DELETE /v1/me') { S.me = null; return null; }
      if (key === 'GET /v1/me/cards') return S.cards;
      if (key === 'POST /v1/me/cards') { if (body.token === 'tok_declined') err(402, 'card_declined', 'That card was declined. Try another.'); S.cards = [D.card]; return D.card; }
      if (key === 'GET /v1/me/saved') return S.saved;
      if (key === 'POST /v1/me/saved') { const v = D.vends.find((x) => x.saves[body.target]); const item = v.saves[body.target]; if (!S.saved.some((s) => s.target === item.target)) S.saved.unshift(item); return item; }
      if (method === 'DELETE' && path.startsWith('/v1/me/saved/')) { S.saved = S.saved.filter((s) => s.id !== path.split('/').pop()); return null; }
      if (key === 'POST /v1/me/vends') {
        const free = S.bottles.filter((b) => b.kind !== 'custom').length;
        if (free >= 3) err(429, 'daily_limit', 'You’ve had your 3 free bottles for today. Your next one is ready tomorrow.');
        const v = D.vends[S.vendIndex++ % D.vends.length];
        const bottle = { ...v.bottle, createdAt: new Date().toISOString() };
        S.bottles.unshift(bottle); S.labels[bottle.id] = v.label;
        return { bottle, countdown: v.countdown, freeLeftToday: 2 - free };
      }
      if (key === 'GET /v1/me/bottles') return { stats: statsOf(), bottles: S.bottles };
      let m = /^\/v1\/me\/bottles\/([^/]+)(\/label\.svg)?$/.exec(path);
      if (m) { const b = S.bottles.find((x) => x.id === m[1]); if (!b) err(404, 'not_found', 'Bottle not found.'); return m[2] ? S.labels[b.id] : b; }
      if (key === 'POST /v1/public/delivery/check') {
        if (!/\d/.test(body.address)) err(422, 'address_not_found', 'We couldn’t find that address. Include the street number and city.');
        return { covered: true, routeName: 'Travis Heights', days: [2, 5] };
      }
      if (key === 'GET /v1/me/delivery') return S.delivery ?? null;
      const DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const nextOn = (day) => { const d = new Date(); d.setDate(d.getDate() + 1); while (d.getDay() !== day) d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); };
      const STEPS = { weekly: 7, biweekly: 14, every4weeks: 28 };
      if (key === 'POST /v1/me/delivery') {
        if (S.delivery) err(409, 'already_subscribed', 'You already have deliveries. Change them instead.');
        const day = body.day ?? 2;
        S.delivery = { id: 'sub_preview', address: body.address, packSize: body.packSize, frequency: body.frequency, day, dayName: DAYN[day], status: 'active', nextDate: nextOn(day), routeId: 'route-3', routeName: 'Travis Heights', routeDays: [2, 5], notes: body.notes ?? null, today: null };
        return S.delivery;
      }
      if (key === 'PATCH /v1/me/delivery') {
        const d = S.delivery; if (!d) err(404, 'not_found', 'You don’t have deliveries yet.');
        if (body.action === 'skip') d.nextDate = new Date(Date.parse(`${d.nextDate}T12:00:00Z`) + STEPS[d.frequency] * 864e5).toISOString().slice(0, 10);
        if (body.action === 'pause') { d.status = 'paused'; d.nextDate = null; }
        if (body.action === 'resume') { d.status = 'active'; d.nextDate = nextOn(d.day); }
        if (body.action === 'cancel') { S.delivery = null; return null; }
        if (body.action === 'update') { if (body.packSize) d.packSize = body.packSize; if (body.frequency) d.frequency = body.frequency; if (body.day !== undefined) { d.day = body.day; d.dayName = DAYN[body.day]; if (d.status === 'active') d.nextDate = nextOn(body.day); } if (body.notes !== undefined) d.notes = body.notes || null; }
        return d;
      }
      if (key === 'POST /v1/me/designs') {
        const r = { id: `ds_${(++DS.n).toString(36)}`, status: 'open', design: { quantity: 1 }, messages: [{ role: 'assistant', text: 'Hi! What’s the occasion, and who is it for? Tell me the colors you like, and tap + to add photos or a video.' }] };
        DS.designs.set(r.id, r); return designView(r);
      }
      let dm = /^\/v1\/me\/designs\/([\w-]+)(\/messages|\/scan-preview|\/proof)?$/.exec(path);
      if (dm) {
        const r = DS.designs.get(dm[1]); if (!r) err(404, 'not_found', 'Design not found.');
        if (!dm[2]) return designView(r);
        if (dm[2] === '/messages') {
          const files = (body.attachments || []).map((a) => {
            if (a.dataUrl) { const url = `/assets/pv-${(++DS.n).toString(36)}.jpg`; DS.files.set(url, a.dataUrl); return { kind: 'image', name: a.name, url, dataUrl: a.dataUrl }; }
            return { kind: 'video', name: a.name, url: a.assetId };
          });
          const out = await L.designer.respond({ design: r.design, history: r.messages, message: body.text, attachments: files.map((f) => ({ kind: f.kind, name: f.name, dataUrl: f.dataUrl })),
            context: { company: 'FreeWater', priceCents: 300, maxBottles: 24, fonts: Object.keys(L.keepsakeFonts), decorations: L.keepsakeDecorations, missing: L.designMissing(r.design), hasPhoto: !!r.design.label?.photo, hasVideo: !!r.design.scan?.videoUrl } });
          const { design, problems } = L.applyDesignPatch(r.design, out.patch || {}, files);
          let reply = out.reply; if (problems.length) reply += `\n\nI couldn’t do part of that: ${problems.join(' ')}`;
          r.messages.push({ role: 'user', text: body.text, ...(files.length ? { attachments: files.map((f) => ({ kind: f.kind, name: f.name })) } : {}) }, { role: 'assistant', text: reply });
          r.design = design;
          return { ...designView(r), suggestions: out.suggestions };
        }
        if (dm[2] === '/scan-preview') {
          const doc = await L.host.open({ pluginId: 'custom-experience', config: L.experienceOf(r.design), theme: L.themeFor(L.company.brand), scan: { target: { kind: 'slot', unitId: 'preview', slot: 0 }, companyId: 'freewater', locationId: 'preview', owner: { name: 'Made just for you', advertiserId: '', campaignId: '' }, viewer: { key: 'p', signedIn: false, interests: [], firstTimeWithAdvertiser: true }, now: new Date() } });
          return swapFiles({ doc, footer: { company: 'FreeWater', brand: L.company.brand, ads: null, giving: L.givingLine(L.company, 'preview'), receiptUrl: null, packUrl: null } });
        }
        if (dm[2] === '/proof') {
          const left = L.designMissing(r.design);
          if (left.length || !r.design.label?.headline) err(422, 'not_ready', `Before the proof, add ${(left.length ? left : ['words']).map((m) => L.designMissingLabels[m]).join(', ')}.`);
          const spec = L.labelSpec(r.design);
          const quantity = r.design.quantity ?? 1;
          const names = /\{name\}/.test(`${spec.headline} ${spec.sub ?? ''}`) ? (r.design.names || []).slice(0, quantity) : [];
          const svgs = Array.from({ length: quantity }, (_, i) => L.keepsakeSvg(spec, W, H, names[i % Math.max(1, names.length)]));
          const label = async (svg, id) => (await L.renderer.render({ unit: { id, companyId: 'freewater', locationId: 'ATX-014', kind: 'custom', placements: [], layout: [6] }, product: L.product, company: L.company, campaigns: new Map(), customArt: L.svgCreative(svg) })).svg;
          const proofId = `pf_${(++DS.n).toString(36)}`;
          DS.proof = { proofId, svgs, label, designId: r.id, experience: L.experienceOf(r.design) };
          return { proofId, labelSvg: await label(svgs[0], proofId), quantity, names, priceCents: 300, totalCents: 300 * quantity, experience: DS.proof.experience,
            note: quantity > 1 ? `This is bottle 1 of ${quantity}.${names.length ? ' Each bottle gets its own name.' : ''} The QR codes here are samples; yours get their own.` : 'This is exactly what will print. The QR codes here are samples; yours get their own.' };
        }
      }
      if (key === 'POST /v1/me/custom-orders' && DS.proof && body.proofId === DS.proof.proofId) {
        const bottles = [];
        for (const svg of DS.proof.svgs) {
          const id = `${D.custom.bottle.id}_${++S.customCount}`;
          const bottle = { ...D.custom.bottle, id, labelUrl: `/v1/me/bottles/${id}/label.svg`, createdAt: new Date().toISOString(), ads: D.custom.bottle.ads.map((a) => ({ ...a, url: `/s/${id}/0` })) };
          S.labels[id] = await DS.proof.label(svg, id);
          bottles.push(bottle);
        }
        S.bottles.unshift(...bottles.slice().reverse());
        DS.designs.get(DS.proof.designId).status = 'ordered';
        return { ...D.custom, bottle: bottles[0], bottles, payment: { ...D.custom.payment, amountCents: 300 * bottles.length }, countdown: { ...D.custom.countdown, seconds: 24 * bottles.length } };
      }
      if (key === 'POST /v1/me/proofs') {
        if (/<script/i.test(body.svg)) err(422, 'artwork_refused', 'Artwork refused: scripts are not allowed');
        S.proofDesign = { svg: body.svg, experience: body.experience };
        return { ...D.proof, labelSvg: D.proof.labelSvg.replace(D.marker, inner(body.svg)) };
      }
      if (key === 'POST /v1/me/custom-orders') {
        const id = `${D.custom.bottle.id}_${++S.customCount}`;
        const bottle = { ...D.custom.bottle, id, labelUrl: `/v1/me/bottles/${id}/label.svg`, createdAt: new Date().toISOString(), ads: D.custom.bottle.ads.map((a) => ({ ...a, url: `/s/${id}/0` })) };
        S.bottles.unshift(bottle); S.labels[id] = D.proof.labelSvg.replace(D.marker, inner(S.proofDesign.svg));
        return { ...D.custom, bottle };
      }
      err(404, 'not_found', 'Not in this preview.');
    },
  };
})();
</script>
<script>
/*APP_JS*/
</script>
