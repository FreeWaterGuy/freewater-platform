# Checks every change before it can go live: types, every test, known security holes, and that the server image
# builds and starts against a real Postgres database.
name: checks
on:
  push:
    branches: [main]
  pull_request:
# Least privilege: the token can only read the code. No job writes to the repository, packages or releases.
permissions:
  contents: read
# Every action is pinned to a full commit (a tag can be moved to other code); Dependabot keeps the pins current
# (.github/dependabot.yml). See docs/SUPPLY-CHAIN.md.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A real Postgres for the tests of locking and concurrency (they run on PGlite too, where one connection hides
    # deadlocks and races: test/db-helpers.ts). Each file makes its own database and drops it.
    services:
      postgres:
        image: postgres:16.10 # TODO(digest): pin as postgres:16.10@sha256:… (docker buildx imagetools inspect postgres:16.10)
        env:
          POSTGRES_USER: fw
          POSTGRES_PASSWORD: fw
          POSTGRES_DB: freewater
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fw" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # exactly the lockfile, with its integrity hashes
      - name: Every installed package is signed by the registry
        run: npm audit signatures
      - run: npm run typecheck
      - name: Static analysis - ESLint (bug and security rules, type-aware; eslint.config.js)
        run: npm run lint
      - name: Static analysis - Semgrep (local rules in .semgrep/; the registry isn't needed)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.182.0
          export PATH="$RUNNER_TEMP/semgrep/bin:$PATH"
          node scripts/semgrep-selftest.mjs semgrep # the rules still catch the planted mistakes
          npm run lint:semgrep
      - name: An empty database for the two-servers test (test/route-delivery.test.ts)
        run: PGPASSWORD=fw psql -h 127.0.0.1 -U fw -d freewater -c 'create database fw_route'
      - run: npx vitest run --reporter=default --reporter=github-actions # failures show as annotations
        env:
          FW_TEST_PG_ADMIN_URL: postgres://fw:fw@127.0.0.1:5432/freewater
          FW_TEST_PG_EMPTY_URL: postgres://fw:fw@127.0.0.1:5432/fw_route
      - name: Known security holes in what runs in production (moderate and above; allowed ones are listed with reasons)
        run: node scripts/audit.mjs
      - name: Fuzz the running API (Schemathesis, pinned; no key, the sample admin key and the sample advertiser's key) - any server error fails
        timeout-minutes: 12
        run: |
          python3 -m venv /tmp/schemathesis
          /tmp/schemathesis/bin/pip install --quiet schemathesis==4.32.2
          SCHEMATHESIS=/tmp/schemathesis/bin/schemathesis FUZZ_REQUEST_TIMEOUT=60 npm run fuzz:api

  browser:
    # The main journeys in a real browser (test/browser/journeys.ts). Playwright isn't a dependency of the app, so
    # it's installed here only; a failing journey fails the check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: npm run test:browser

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10 # TODO(digest): pin as postgres:16.10@sha256:… (docker buildx imagetools inspect postgres:16.10)
        env:
          POSTGRES_USER: fw
          POSTGRES_PASSWORD: fw
          POSTGRES_DB: freewater
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fw" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the upgrade step builds the previous release too
      - name: Build the server image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t freewater:${{ github.sha }} .
      - name: Internal secrets for the production starts (production takes them only from the host's settings)
        run: |
          umask 077
          for n in CODES SECOND_STEP LINKS WALLET VIEWER_TAGS; do echo "FW_SECRET_$n=hex:$(openssl rand -hex 32)"; done > fw-secrets.env
      - name: Start it the way production does, and wait until it's ready
        run: |
          docker run -d --name fw --network host \
            --env-file fw-secrets.env -e NODE_ENV=production -e ALLOW_STANDINS=1 -e PORT=8080 -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater \
            freewater:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "::error title=start::$(docker logs fw 2>&1 | tail -c 900 | tr '\n' ' ')"; exit 1
      - name: Production refuses the stand-ins unless told this is a rehearsal
        run: |
          if docker run --rm --network host --env-file fw-secrets.env -e NODE_ENV=production -e PORT=8082 -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater freewater:${{ github.sha }} > standins.txt 2>&1; then
            echo "::error title=stand-ins::started on stand-ins without ALLOW_STANDINS=1"; exit 1
          fi
          grep -q "ALLOW_STANDINS=1" standins.txt || { echo "::error title=stand-ins::$(tail -c 900 standins.txt | tr '\n' ' ')"; exit 1; }
      - name: A second copy must wait, not share the data
        run: |
          if docker run --rm --network host --env-file fw-secrets.env -e NODE_ENV=production -e ALLOW_STANDINS=1 -e PORT=8081 -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater -e LEASE_WAIT_MS=5000 \
            freewater:${{ github.sha }} > second.txt 2>&1; then
            echo "::error title=lease::a second server started alongside the first"; exit 1
          fi
          # It must have refused for the right reason (the lease), not crashed for another.
          grep -q "still owns the data" second.txt || { echo "::error title=lease::$(tail -c 900 second.txt | tr '\n' ' ')"; exit 1; }
          echo "refused, as it should"
      - name: A backup made inside the image restores, and its books check out
        run: |
          set -o pipefail
          docker exec fw sh -c 'psql postgres://fw:fw@localhost:5432/freewater -qc "create database spare"' 2>&1 | tee out.txt
          docker exec -e BACKUP_KEY=$(openssl rand -base64 32) -e BACKUP_DIR=/tmp/backups -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater -e RESTORE_TEST_URL=postgres://fw:fw@localhost:5432/spare fw \
            sh -c 'node --import tsx src/server/backup.ts && node --import tsx src/server/backup.ts restore' 2>&1 | tee -a out.txt \
            || { echo "::error title=backup::$(tail -c 900 out.txt | tr '\n' ' ')"; exit 1; }
      - name: Stops cleanly and hands over
        run: |
          docker stop -t 50 fw
          docker logs fw 2>&1 | tail -5
          code=$(docker inspect fw --format '{{.State.ExitCode}}')
          [ "$code" = "0" ] || { echo "::error title=stop::exited with $code"; exit 1; }
          # The next server takes over at once (the lease was let go, not left to lapse).
          docker run -d --name fw2 --network host --env-file fw-secrets.env -e NODE_ENV=production -e ALLOW_STANDINS=1 -e PORT=8080 -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater -e LEASE_WAIT_MS=10000 \
            freewater:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready; then echo; break; fi
            [ "$i" = 30 ] && { echo "::error title=handover::$(docker logs fw2 2>&1 | tail -c 900 | tr '\n' ' ')"; exit 1; }
            sleep 2
          done
          if docker logs fw2 2>&1 | grep -q "Waiting for the other server"; then echo "::error title=handover::the lease wasn't let go on stop"; exit 1; fi
          docker stop -t 50 fw2
          [ "$(docker inspect fw2 --format '{{.State.ExitCode}}')" = "0" ] || { echo "::error title=stop::second server didn't stop cleanly"; exit 1; }
      - name: The new version migrates a database the previous release filled
        run: |
          set -o pipefail
          prev=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ -z "$prev" ] || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then prev=$(git rev-parse HEAD^1); fi
          echo "Previous release: $prev"
          git worktree add /tmp/prev "$prev"
          docker build -t freewater:prev /tmp/prev
          docker run --rm --network host postgres:16.10 psql postgres://fw:fw@localhost:5432/freewater -qc "create database upgrade"
          # The previous release, filled with the sample data (not production mode: that refuses SEED_DEMO).
          docker run -d --name prev --network host -e NODE_ENV=development -e HOST=127.0.0.1 -e PORT=8090 -e SEED_DEMO=1 \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/upgrade freewater:prev
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/health/ready; then echo; break; fi
            [ "$i" = 60 ] && { echo "::error title=upgrade::$(docker logs prev 2>&1 | tail -c 900 | tr '\n' ' ')"; exit 1; }
            sleep 2
          done
          docker stop -t 50 prev
          # Production refuses secrets that differ from those already in the database: move them to the settings as they are.
          docker run --rm --network host postgres:16.10 psql postgres://fw:fw@localhost:5432/upgrade -Atc "select name, value from platform_secrets" \
            | while IFS='|' read -r name value; do echo "FW_SECRET_$(echo "$name" | tr 'a-z' 'A-Z' | tr -c 'A-Z0-9\n' '_')=hex:$value"; done > upgrade-secrets.env
          grep -v -F -f <(cut -d= -f1 upgrade-secrets.env | sed 's/$/=/') fw-secrets.env >> upgrade-secrets.env || true
          # This version on it: migrations apply over real data, and it starts.
          docker run -d --name upg --network host --env-file upgrade-secrets.env -e NODE_ENV=production -e ALLOW_STANDINS=1 -e PORT=8091 -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/upgrade freewater:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8091/health/ready; then echo; break; fi
            [ "$i" = 60 ] && { echo "::error title=upgrade::$(docker logs upg 2>&1 | tail -c 900 | tr '\n' ' ')"; exit 1; }
            sleep 2
          done
          docker stop -t 50 upg
          # And its books still check out.
          docker run --rm --network host --env-file upgrade-secrets.env -e ALLOW_STANDINS=1 -e DATABASE_URL=postgres://fw:fw@localhost:5432/upgrade freewater:${{ github.sha }} \
            node --import tsx src/server/booksCheck.ts 2>&1 | tee books.txt \
            || { echo "::error title=upgrade::$(tail -c 900 books.txt | tr '\n' ' ')"; exit 1; }
      - name: Outages - the database goes away briefly and for long, a server is killed, a server freezes
        run: |
          PG=${{ job.services.postgres.id }}
          start() { docker run -d --name "$1" --network host --env-file fw-secrets.env -e NODE_ENV=production -e ALLOW_STANDINS=1 -e PORT="$2" -e TRUST_PROXY=1 -e PUBLIC_URL=https://ci.example.org \
            -e DATABASE_URL=postgres://fw:fw@localhost:5432/freewater -e LEASE_WAIT_MS=90000 freewater:${{ github.sha }} >/dev/null; }
          ready() { for i in $(seq 1 45); do curl -sf "http://localhost:$1/health/ready" >/dev/null && return 0; sleep 2; done; return 1; }
          fail() { echo "::error title=outage::$1 $(docker logs "$2" 2>&1 | tail -c 700 | tr '\n' ' ')"; exit 1; }
          running() { [ "$(docker inspect "$1" --format '{{.State.Running}}')" = true ]; }
          pg_up() { for i in $(seq 1 30); do docker exec "$PG" pg_isready -U fw >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }

          # 1. A short database outage (a restart, a failover) is ridden out by the same server.
          start o1 8080; ready 8080 || fail "didn't start" o1
          docker stop -t 5 "$PG"; sleep 6
          curl -sf http://localhost:8080/health/live >/dev/null || fail "not alive during a short outage" o1
          docker start "$PG"; pg_up || fail "postgres didn't come back" o1
          ready 8080 || fail "not ready again after a short outage" o1
          running o1 || fail "stopped on a short outage" o1

          # 2. A long one costs the server its claim to the data: it stops (code 2) rather than guess.
          docker stop -t 5 "$PG"; sleep 35
          running o1 && fail "kept running 35 s without the database" o1
          [ "$(docker inspect o1 --format '{{.State.ExitCode}}')" = 2 ] || fail "exited with the wrong code" o1
          docker start "$PG"; pg_up || fail "postgres didn't come back" o1
          start o2 8080; ready 8080 || fail "the next server didn't start once the database was back" o2

          # 3. Killed outright (no clean stop): the next server waits for the claim to lapse, then takes over.
          docker kill o2 >/dev/null
          start o3 8080; ready 8080 || fail "didn't take over after a killed server" o3

          # 4. Frozen: another takes over; when the frozen one wakes it stops at once instead of writing.
          docker pause o3
          start o4 8081; ready 8081 || fail "didn't take over from a frozen server" o4
          docker unpause o3; sleep 8
          running o3 && fail "a frozen server kept running after waking" o3
          ready 8081 || fail "the new server isn't ready after the old one woke" o4
          docker stop -t 50 o4 >/dev/null
          [ "$(docker inspect o4 --format '{{.State.ExitCode}}')" = 0 ] || fail "didn't stop cleanly" o4
          echo "all outages handled"
